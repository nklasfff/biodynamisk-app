<!DOCTYPE html>
<html lang="da">
<head>
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA / iOS standalone-mode -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Biodynamisk">
  <meta name="theme-color" content="#131a22">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Den Biodynamiske App</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cinzel:wght@300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <!-- Marked.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="container" id="app-container">
    <!-- Content loaded dynamically via JavaScript -->
    <div style="text-align: center; padding: 60px 20px; color: var(--text-secondary);">
      <p>Indlæser...</p>
    </div>
  </div>

  <script>
    // Parse YAML frontmatter (simple regex-baseret parser)
    function parseFrontmatter(markdown) {
      const frontmatterRegex = /^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/;
      const match = markdown.match(frontmatterRegex);

      if (!match) {
        return { frontmatter: {}, content: markdown };
      }

      const frontmatterText = match[1];
      const content = match[2];

      const frontmatter = {};
      frontmatterText.split('\n').forEach(line => {
        const colonIndex = line.indexOf(':');
        if (colonIndex > -1) {
          const key = line.substring(0, colonIndex).trim();
          let value = line.substring(colonIndex + 1).trim();
          // Remove quotes if present
          value = value.replace(/^["']|["']$/g, '');
          frontmatter[key] = value;
        }
      });

      return { frontmatter, content };
    }

    // Parse markdown content into sections
    function parseContent(markdownContent) {
      const sections = {};
      const lines = markdownContent.split('\n');
      let currentSection = null;
      let currentContent = [];

      lines.forEach(line => {
        if (line.startsWith('## ')) {
          // Save previous section
          if (currentSection) {
            sections[currentSection] = currentContent.join('\n').trim();
          }
          // Start new section
          currentSection = line.replace('## ', '').trim();
          currentContent = [];
        } else if (currentSection) {
          currentContent.push(line);
        }
      });

      // Save last section
      if (currentSection) {
        sections[currentSection] = currentContent.join('\n').trim();
      }

      return sections;
    }

    // Parse '### subsections' inside a section's content into title-keyed object.
    // Returns empty object if no '### ' headings found.
    function parseSubsections(content) {
      const subs = {};
      const order = [];
      const lines = content.split('\n');
      let current = null;
      let buf = [];
      lines.forEach(line => {
        if (line.startsWith('### ')) {
          if (current) subs[current] = buf.join('\n').trim();
          current = line.replace('### ', '').trim();
          order.push(current);
          buf = [];
        } else if (current) {
          buf.push(line);
        }
      });
      if (current) subs[current] = buf.join('\n').trim();
      return { subs, order };
    }

    // Map kapitel IDs to SVG filenames
    const KAPITEL_SVG_MAP = {
      'den-biodynamiske-model': '24-modellen-oversigt.svg',
      'i-behandlingssituationen': 'i-behandlingssituationen.svg',
      'helheden-under-pres': 'helhed-1-balance.svg',
      'ordliste': '38-ordliste.svg',
      'blechschmidts-principper': '28-blechschmidt.svg',
      'de-otte-essentielle-egenskaber': '29-egenskaber-oversigt.svg',
      'typiske-klientmoenstre': '30-klientmoenstre-oversigt.svg',
      'de-syv-perspektiver': '32-perspektiver-oversigt.svg',
      'de-fire-guidede-oevelser': '33-oevelser-oversigt.svg',
      'andre-traditioner-og-specielle-temaer': '34-traditioner-oversigt.svg',
      'integration-i-din-praksis': '35-integration-oversigt.svg',
      'afslutning': '36-afslutning-oversigt.svg'
    };

    // Map kapitel IDs to parent section (so back-button går til rigtig sektion)
    const KAPITEL_PARENT = {
      'den-biodynamiske-model': { href: 'modellen.html', label: 'Modellen' },
      'blechschmidts-principper': { href: 'modellen.html', label: 'Modellen' },
      'i-behandlingssituationen': { href: 'modellen.html', label: 'Modellen' },
      'helheden-under-pres': { href: 'modellen.html', label: 'Modellen' },
      'ordliste': { href: 'modellen.html', label: 'Modellen' },
      'de-otte-essentielle-egenskaber': { href: 'behandleren.html', label: 'Behandleren' },
      'typiske-klientmoenstre': { href: 'behandleren.html', label: 'Behandleren' },
      'de-syv-perspektiver': { href: 'rejsen.html', label: 'Rejsen' },
      'de-fire-guidede-oevelser': { href: 'rejsen.html', label: 'Rejsen' },
      'andre-traditioner-og-specielle-temaer': { href: 'inspiration.html', label: 'Inspiration' },
      'integration-i-din-praksis': { href: 'inspiration.html', label: 'Inspiration' },
      'afslutning': { href: 'inspiration.html', label: 'Inspiration' }
    };

    // Load hero SVG dynamically from file
    async function loadHeroSVG(kapitelId) {
      const filename = KAPITEL_SVG_MAP[kapitelId];

      if (!filename) {
        // Return a placeholder for kapitels without specific illustrations
        return `
          <svg viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">
            <rect width="380" height="380" fill="#131a22"/>
          </svg>
        `;
      }

      try {
        const response = await fetch(`hero-motiver/${filename}`);

        if (!response.ok) {
          throw new Error(`Could not load ${filename}`);
        }

        return await response.text();
      } catch (error) {
        console.error('Error loading hero SVG:', error);
        // Return placeholder on error
        return `
          <svg viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">
            <rect width="380" height="380" fill="#131a22"/>
          </svg>
        `;
      }
    }

    // Main render function
    async function renderKapitel(kapitelId) {
      const container = document.getElementById('app-container');

      try {
        // Fetch markdown file
        const mdResponse = await fetch(`content/${kapitelId}.md`);
        if (!mdResponse.ok) {
          throw new Error(`Kunne ikke loade ${kapitelId}.md`);
        }
        const markdownText = await mdResponse.text();

        // Parse frontmatter and content
        const { frontmatter, content } = parseFrontmatter(markdownText);
        const sections = parseContent(content);

        // Load hero SVG
        const heroSVG = await loadHeroSVG(kapitelId);

        // Generate HTML - using string parts to avoid template literal issues
        const parent = KAPITEL_PARENT[kapitelId] || { href: 'index.html', label: 'Hjem' };

        let html = '';
        html += '<header class="top-nav">';
        html += `<button class="back-btn" onclick="window.location.href='${parent.href}'">‹ ${parent.label}</button>`;
        html += `<span class="category-label">${parent.label.toUpperCase()}</span>`;
        html += '</header>';
        html += '<div class="hero-container" style="max-width: 380px; margin: 32px auto;">';
        html += heroSVG;
        html += '</div>';
        html += '<h1 class="main-title">' + frontmatter.titel.toUpperCase() + '</h1>';

        // Undertitel (hvis den findes)
        if (frontmatter.undertitel) {
          html += `<p class="subtitle">${frontmatter.undertitel}</p>`;
        }

        html += `<div class="divider"></div>`;

        // Intro text (always visible)
        if (sections['Intro']) {
          html += `<div class="intro-text">${marked.parse(sections['Intro'])}</div>`;
        }

        const sekventiel = frontmatter.layout === 'sekventiel';

        if (sekventiel) {
          // Sekventielt layout — sektioner bygges med <img> tags som normalt;
          // SVG'er inlines som DOM EFTER container.innerHTML er sat.
          const sectionTitles = Object.keys(sections).filter(t =>
            t !== 'Intro' && t !== 'Relationer' && t !== 'Til refleksion'
          );

          for (const sectionTitle of sectionTitles) {
            html += `
              <section class="sekvens-step">
                <h2 class="sekvens-title">${sectionTitle}</h2>
                <div class="sekvens-content">
                  ${marked.parse(sections[sectionTitle])}
                </div>
              </section>
            `;
          }
        } else {
          // Collapsible cards
          const isOevelser = kapitelId === 'de-fire-guidede-oevelser';
          const isPerspektiver = kapitelId === 'de-syv-perspektiver';
          const isIntegration = kapitelId === 'integration-i-din-praksis';

          // For Integration: 'Til refleksion' har sub-sektioner med samme navne
          // som hovedkortene. Hver kort-tekst suppleres med illustration +
          // 'Til refleksion'-overskrift + den matchende refleksion.
          let integrationRefs = {};
          if (isIntegration && sections['Til refleksion']) {
            const { subs } = parseSubsections(sections['Til refleksion']);
            integrationRefs = subs;
          }

          html += '<div class="cards-container">';
          Object.keys(sections).forEach(sectionTitle => {
            if (sectionTitle === 'Intro' || sectionTitle === 'Relationer' || sectionTitle === 'Til refleksion') {
              return;
            }

            // De 4 guidede øvelser: alle kort (1-4 + Afrunding) åbner som egen skærm
            if (isOevelser) {
              const exMatch = sectionTitle.match(/^(\d+)\.\s/);
              if (exMatch) {
                html += `
                  <a class="card card-link" href="oevelse.html?id=${exMatch[1]}">
                    <div class="card-header">
                      <span class="card-marker"></span>
                      <span class="card-title">${sectionTitle}</span>
                      <span class="chevron chevron-static">›</span>
                    </div>
                  </a>
                `;
                return;
              }
              if (sectionTitle === 'Afrunding') {
                html += `
                  <a class="card card-link" href="oevelse.html?id=afrunding">
                    <div class="card-header">
                      <span class="card-marker"></span>
                      <span class="card-title">${sectionTitle}</span>
                      <span class="chevron chevron-static">›</span>
                    </div>
                  </a>
                `;
                return;
              }
            }

            // De 7 perspektiver: udskil '### Refleksioner over perspektivet' og
            // erstat med en "Gå til refleksion"-trigger nederst i kortet
            let cardContent;
            if (isPerspektiver) {
              const refMarker = '### Refleksioner over perspektivet';
              const src = sections[sectionTitle];
              const idx = src.indexOf(refMarker);
              if (idx > -1) {
                const before = src.substring(0, idx).trim();
                const refRaw = src.substring(idx).trim();
                const refSp = RefleksionsRum.splitMarkdown(refRaw);
                const trigger = refSp.length > 0
                  ? RefleksionsRum.triggerHTML({
                      spoergsmaal: refSp,
                      kilde: sectionTitle,
                      label: 'Refleksioner over perspektivet'
                    })
                  : '';
                cardContent = `${marked.parse(before)}${trigger}`;
              } else {
                cardContent = marked.parse(src);
              }
            } else if (isIntegration && integrationRefs[sectionTitle]) {
              // Integration: tilføj "Gå til refleksion"-trigger med kun det
              // matchende temas refleksioner
              const refSp = RefleksionsRum.splitMarkdown(integrationRefs[sectionTitle]);
              const trigger = refSp.length > 0
                ? RefleksionsRum.triggerHTML({
                    spoergsmaal: refSp,
                    kilde: sectionTitle
                  })
                : '';
              cardContent = `${marked.parse(sections[sectionTitle])}${trigger}`;
            } else {
              cardContent = marked.parse(sections[sectionTitle]);
            }

            html += `
              <div class="card">
                <div class="card-header" onclick="toggleCard(this)">
                  <span class="card-marker"></span>
                  <span class="card-title">${sectionTitle}</span>
                  <span class="chevron">▾</span>
                </div>
                <div class="card-content" onclick="closeCardFromContent(event, this)">
                  ${cardContent}
                </div>
              </div>
            `;
          });

          html += '</div>';

          // De 7 perspektiver: 'helhed' som "Gå til refleksion"-trigger
          if (isPerspektiver && sections['Til refleksion']) {
            const { subs: refSubs, order: refOrder } = parseSubsections(sections['Til refleksion']);
            if (refOrder.length > 0) {
              const helhedTitle = refOrder[0];
              const helhedContent = refSubs[helhedTitle] || '';
              const refSp = RefleksionsRum.splitMarkdown(helhedContent);
              if (refSp.length > 0) {
                html += RefleksionsRum.triggerHTML({
                  spoergsmaal: refSp,
                  kilde: helhedTitle,
                  label: helhedTitle
                });
              }
            }
          }

          // Perspektiver-oversigt: øje-figur placeret under sidste kort,
          // pupil i midten + 3 orbs på øvre låg + 4 orbs på nedre låg.
          if (kapitelId === 'de-syv-perspektiver') {
            html += `
              <section class="perspektiver-oversigt-block">
                <h2 class="section-heading">Et samlet perspektiv</h2>
                <p class="perspektiver-oversigt-intro">Tryk på en orb for at se essensen af hvert perspektiv.</p>
                <div id="perspektiver-svg-wrapper"></div>
                <div id="perspektiver-detail" class="perspektiver-detail"></div>
              </section>
            `;
          }
        }

        // Refleksioner — som "Gå til refleksion"-trigger(s) der åbner fuldskærms-rum
        // Skip for kapitler hvor refleksioner er flyttet ind i kortene
        if (sections['Til refleksion']
            && kapitelId !== 'de-fire-guidede-oevelser'
            && kapitelId !== 'de-syv-perspektiver'
            && kapitelId !== 'integration-i-din-praksis') {
          const refContent = sections['Til refleksion'];
          const { subs: refSubs, order: refOrder } = parseSubsections(refContent);

          if (refOrder.length > 0) {
            // Tematiserede refleksioner — én trigger pr. tema
            refOrder.forEach(title => {
              const refSp = RefleksionsRum.splitMarkdown(refSubs[title]);
              if (refSp.length > 0) {
                html += RefleksionsRum.triggerHTML({
                  spoergsmaal: refSp,
                  kilde: title,
                  label: title
                });
              }
            });
          } else {
            // Klassisk: ét sæt spørgsmål — én trigger
            const refSp = RefleksionsRum.splitMarkdown(refContent);
            if (refSp.length > 0) {
              html += RefleksionsRum.triggerHTML({
                spoergsmaal: refSp,
                kilde: frontmatter.titel
              });
            }
          }
        }

        // Traditioner-oversigt: snake-S figur med orbs som hurtig reference,
        // placeret efter sidste kort og refleksion. Auto-scroll ved tap.
        if (kapitelId === 'andre-traditioner-og-specielle-temaer') {
          html += `
            <section class="traditioner-oversigt-block">
              <h2 class="section-heading">Rejsen gennem andre traditioner</h2>
              <p class="traditioner-oversigt-intro">Et hurtigt overblik — tryk på en orb for at se essensen af hvert tema.</p>
              <div id="traditioner-svg-wrapper"></div>
              <div id="traditioner-detail" class="traditioner-detail"></div>
            </section>
          `;
        }

        // Egenskaber-oversigt: cirkel-figur med 8 orbs på perimeteret + 1 centrum,
        // placeret efter sidste refleksion. Auto-scroll til detalje-panel ved tap.
        if (kapitelId === 'de-otte-essentielle-egenskaber') {
          html += `
            <section class="egenskaber-oversigt-block">
              <h2 class="section-heading">De 8 essentielle egenskaber</h2>
              <p class="egenskaber-oversigt-intro">Tryk på en orb for at se essensen af hver egenskab.</p>
              <div id="egenskaber-svg-wrapper"></div>
              <div id="egenskaber-detail" class="egenskaber-detail"></div>
            </section>
          `;
        }

        // Bottom navigation — placeholder, fyldes af BottomNav.render() med data-active fra parent
        const activeKey = parent.label.toLowerCase();
        html += `<nav class="bottom-nav" data-active="${activeKey}"></nav>`;

        // Update page title
        document.title = `${frontmatter.titel} — Den Biodynamiske App`;

        // Render
        container.innerHTML = html;
        if (window.BottomNav) window.BottomNav.render();
        if (window.TraditionerOversigt) window.TraditionerOversigt.init();
        if (window.PerspektiverOversigt) window.PerspektiverOversigt.init();
        if (window.EgenskaberOversigt) window.EgenskaberOversigt.init();

        // POST-RENDER: erstat <img src="*.svg"> i sekvens-content med inline SVG.
        // Dette skal ske EFTER innerHTML, så browseren har parset DOM korrekt.
        // SMIL <animate> kører i inline SVG men IKKE i <img>-tag.
        if (sekventiel) {
          const sekvensImgs = container.querySelectorAll('.sekvens-content img[src$=".svg"], .sekvens-content img[src*=".svg?"]');
          for (const img of sekvensImgs) {
            try {
              const src = img.getAttribute('src');
              const url = src.includes('?') ? src : src + '?v=' + Date.now();
              const svgResp = await fetch(url);
              if (!svgResp.ok) continue;
              const svgText = await svgResp.text();
              const wrapper = document.createElement('div');
              wrapper.className = 'sekvens-illustration';
              wrapper.innerHTML = svgText;
              // Hvis <img> er eneste child af <p>, replace <p> for at undgå
              // ugyldigt <p><div>...</div></p>
              const parent = img.parentElement;
              if (parent && parent.tagName === 'P' && parent.children.length === 1) {
                parent.replaceWith(wrapper);
              } else {
                img.replaceWith(wrapper);
              }
            } catch (err) {
              console.error('Kunne ikke loade SVG:', img.src, err);
            }
          }
        }

      } catch (error) {
        console.error('Fejl ved indlæsning:', error);
        container.innerHTML = `
          <div style="text-align: center; padding: 60px 20px;">
            <h1 style="font-family: var(--font-display); font-size: 24px; color: var(--text-primary); margin-bottom: 12px;">
              KAPITEL IKKE FUNDET
            </h1>
            <p style="font-family: var(--font-body); font-size: 17px; color: var(--text-secondary); line-height: 1.75; margin-bottom: 24px;">
              Kapitlet med id <strong>${kapitelId}</strong> kunne ikke indlæses.
            </p>
            <button onclick="window.location.href='modellen.html'"
                    style="font-family: var(--font-body); font-size: 14px; font-style: italic;
                           color: var(--text-secondary); background: none; border: 1px solid var(--border-card);
                           border-radius: 8px; padding: 10px 20px; cursor: pointer;">
              Tilbage til Modellen
            </button>
          </div>
        `;
      }
    }

    // toggleCard, closeCardFromContent ligger i js/card-interactions.js

    // Get kapitel ID from URL and render
    const urlParams = new URLSearchParams(window.location.search);
    const kapitelId = urlParams.get('id');

    if (!kapitelId) {
      document.getElementById('app-container').innerHTML = `
        <div style="text-align: center; padding: 60px 20px;">
          <h1 style="font-family: var(--font-display); font-size: 24px; color: var(--text-primary); margin-bottom: 12px;">
            INTET KAPITEL VALGT
          </h1>
          <p style="font-family: var(--font-body); font-size: 17px; color: var(--text-secondary); line-height: 1.75;">
            Tilføj <code>?id=...</code> til URL'en.
          </p>
        </div>
      `;
    } else {
      window.scrollTo(0, 0);
      renderKapitel(kapitelId);
    }
  </script>

  <script src="js/card-interactions.js"></script>
  <script src="js/theme-toggle.js"></script>
  <script src="js/bottom-nav.js"></script>
  <script src="js/traditioner-oversigt.js"></script>
  <script src="js/perspektiver-oversigt.js"></script>
  <script src="js/egenskaber-oversigt.js"></script>
  <script src="js/refleksions-rum.js"></script>
</body>
</html>
