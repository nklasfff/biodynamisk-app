    </radialGradient>
    <radialGradient id="e1" cx="700" cy="456" r="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D5DCE5"/>
      <stop offset="100%" stop-color="#CBD5E0"/>
    </radialGradient>
    <radialGradient id="e2" cx="700" cy="491" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B0BCCB"/>
      <stop offset="100%" stop-color="#A0AEC0"/>
    </radialGradient>
    <radialGradient id="e3" cx="700" cy="527" r="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A2B5"/>
      <stop offset="100%" stop-color="#8A98AB"/>
    </radialGradient>
    <radialGradient id="e4" cx="700" cy="563" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7E8DA0"/>
      <stop offset="100%" stop-color="#718096"/>
    </radialGradient>
    <radialGradient id="e5" cx="700" cy="599" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A6678"/>
      <stop offset="100%" stop-color="#525E70"/>
    </radialGradient>
    <radialGradient id="e6" cx="700" cy="634" r="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#3F4A5C"/>
    </radialGradient>
    <radialGradient id="e7" cx="700" cy="670" r="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </radialGradient>
