<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 380 380" role="img" aria-label="Breath of Life">
<title>Breath of Life</title>
<desc>Et mørkt rum hvor kerne og aura ånder. Omkring dem driver små filamenter af lys kaleidoskopisk — energien har endnu ikke taget fast, manifest form.</desc>

<defs>
<style>
@keyframes core-r { 0%, 100% { r: 36px; } 50% { r: 46px; } }
@keyframes aura-r { 0%, 100% { rx: 158px; ry: 158px; } 50% { rx: 182px; ry: 182px; } }

/* Filamenterne roterer hver om sin egen midte — nogle med uret,
   nogle imod. Forskellige tempi og forsinkelser gør at feltet
   aldrig sætter sig i et fast mønster. */
@keyframes fil-cw { from { rotate: 0deg; } to { rotate: 360deg; } }
@keyframes fil-ccw { from { rotate: 0deg; } to { rotate: -360deg; } }
@keyframes fil-flick {
  0%, 100% { opacity: 0.18; }
  50% { opacity: 0.85; }
}

.core { animation: core-r 8s ease-in-out infinite; }
.aura { animation: aura-r 8s ease-in-out infinite; }

.filament {
  transform-box: fill-box;
  transform-origin: center;
}

.f-1 { animation: fil-cw 14s linear infinite, fil-flick 6s ease-in-out infinite; }
.f-2 { animation: fil-ccw 18s linear infinite, fil-flick 7s ease-in-out infinite; animation-delay: -2s, -2s; }
.f-3 { animation: fil-cw 11s linear infinite, fil-flick 5s ease-in-out infinite; animation-delay: -4s, -1s; }
.f-4 { animation: fil-ccw 16s linear infinite, fil-flick 8s ease-in-out infinite; animation-delay: -6s, -3s; }
.f-5 { animation: fil-cw 13s linear infinite, fil-flick 6s ease-in-out infinite; animation-delay: -8s, -4s; }
.f-6 { animation: fil-ccw 15s linear infinite, fil-flick 7s ease-in-out infinite; animation-delay: -1s, -5s; }
.f-7 { animation: fil-cw 17s linear infinite, fil-flick 9s ease-in-out infinite; animation-delay: -3s, -2s; }
.f-8 { animation: fil-ccw 12s linear infinite, fil-flick 5s ease-in-out infinite; animation-delay: -5s, -3s; }
.f-9 { animation: fil-cw 19s linear infinite, fil-flick 6s ease-in-out infinite; animation-delay: -7s, -1s; }
.f-10 { animation: fil-ccw 14s linear infinite, fil-flick 8s ease-in-out infinite; animation-delay: -2s, -4s; }
.f-11 { animation: fil-cw 16s linear infinite, fil-flick 7s ease-in-out infinite; animation-delay: -4s, -5s; }
.f-12 { animation: fil-ccw 13s linear infinite, fil-flick 5s ease-in-out infinite; animation-delay: -6s, -2s; }

@media (prefers-reduced-motion: reduce) {
  .core, .aura,
  .f-1, .f-2, .f-3, .f-4, .f-5, .f-6,
  .f-7, .f-8, .f-9, .f-10, .f-11, .f-12 { animation: none; }
}
</style>
<radialGradient id="well" cx="50%" cy="42%" r="65%">
<stop offset="0%" stop-color="#1f2a35"/>
<stop offset="55%" stop-color="#131a22"/>
<stop offset="100%" stop-color="#0c1218"/>
</radialGradient>
<radialGradient id="core-g" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#f8f8f8" stop-opacity="1"/>
<stop offset="30%" stop-color="#e0e0e0" stop-opacity="0.6"/>
<stop offset="70%" stop-color="#b0b0b0" stop-opacity="0.15"/>
<stop offset="100%" stop-color="#b0b0b0" stop-opacity="0"/>
</radialGradient>
<radialGradient id="aura-g" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#dcdcdc" stop-opacity="0.28"/>
<stop offset="55%" stop-color="#909090" stop-opacity="0.07"/>
<stop offset="100%" stop-color="#909090" stop-opacity="0"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="380" height="640" fill="url(#well)"/>

<ellipse class="aura" cx="190" cy="270" rx="170" ry="170" fill="url(#aura-g)"/>

<!-- 12 små filamenter fordelt rundt om kernen ved radius ~85.
     Hver roterer om sin egen midte og flimrer i opacitet — energien
     har ingen fast form, kun kaleidoskopisk bevægelse. -->
<g stroke="#e0e0e0" stroke-width="0.9" stroke-linecap="round" fill="none">
  <line class="filament f-1" x1="263" y1="270" x2="287" y2="270"/>
  <line class="filament f-2" x1="252" y1="313" x2="276" y2="313"/>
  <line class="filament f-3" x1="221" y1="344" x2="245" y2="344"/>
  <line class="filament f-4" x1="178" y1="355" x2="202" y2="355"/>
  <line class="filament f-5" x1="136" y1="344" x2="160" y2="344"/>
  <line class="filament f-6" x1="104" y1="313" x2="128" y2="313"/>
  <line class="filament f-7" x1="93" y1="270" x2="117" y2="270"/>
  <line class="filament f-8" x1="104" y1="227" x2="128" y2="227"/>
  <line class="filament f-9" x1="136" y1="196" x2="160" y2="196"/>
  <line class="filament f-10" x1="178" y1="185" x2="202" y2="185"/>
  <line class="filament f-11" x1="221" y1="196" x2="245" y2="196"/>
  <line class="filament f-12" x1="252" y1="227" x2="276" y2="227"/>
</g>

<circle class="core" cx="190" cy="270" r="42" fill="url(#core-g)"/>

<line x1="140" y1="520" x2="240" y2="520" stroke="#b0b0b0" stroke-width="0.5" opacity="0.5"/>
<text x="190" y="555" text-anchor="middle" font-family="Cinzel, serif" font-size="12" letter-spacing="4" fill="#e0e0e0" opacity="0.95">BREATH OF LIFE</text>
<text x="190" y="580" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="13" font-style="italic" fill="#b0b0b0" opacity="0.8">den første manifestation</text>
</svg>
