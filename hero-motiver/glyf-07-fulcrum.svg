<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" style="font-family: 'TeX Gyre Pagella', Palatino, serif;">
  <defs>
    <radialGradient id="kerne" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#020F17"/>
      <stop offset="100%" stop-color="#000205"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1000" fill="#ffffff"/>

  <g fill="none" stroke-linecap="round">
    <ellipse cx="500" cy="500" rx="320" ry="120" stroke="#345261" stroke-width="1.5" opacity="0.55"/>
    <ellipse cx="500" cy="500" rx="320" ry="120" stroke="#587787" stroke-width="1.2" opacity="0.45" transform="rotate(60 500 500)"/>
    <ellipse cx="500" cy="500" rx="320" ry="120" stroke="#7794A4" stroke-width="1.2" opacity="0.45" transform="rotate(120 500 500)"/>

    <ellipse cx="500" cy="500" rx="220" ry="80" stroke="#203C4A" stroke-width="1" stroke-dasharray="2 5" opacity="0.5" transform="rotate(30 500 500)"/>
    <ellipse cx="500" cy="500" rx="220" ry="80" stroke="#345261" stroke-width="1" stroke-dasharray="2 5" opacity="0.5" transform="rotate(90 500 500)"/>
    <ellipse cx="500" cy="500" rx="220" ry="80" stroke="#4A6878" stroke-width="1" stroke-dasharray="2 5" opacity="0.5" transform="rotate(150 500 500)"/>
  </g>

  <g stroke="#576570" stroke-width="0.6" stroke-dasharray="1 4" fill="none" opacity="0.35">
    <line x1="500" y1="280" x2="500" y2="720"/>
    <line x1="280" y1="500" x2="720" y2="500"/>
    <line x1="335" y1="335" x2="665" y2="665"/>
    <line x1="665" y1="335" x2="335" y2="665"/>
  </g>

  <circle cx="500" cy="500" r="55" fill="url(#kerne)"/>

  <g font-style="italic" font-weight="500" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.015em" fill="#061D2B">
    <text x="500" y="850" font-size="32" font-weight="700">Fulcrum</text>
    <text x="500" y="888" font-size="22">det dynamiske omdrejningspunkt</text>
  </g>
</svg>
