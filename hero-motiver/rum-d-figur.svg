<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 886 886" style="font-family: 'TeX Gyre Pagella', Palatino, serif;">
  <rect width="886" height="886" fill="#ffffff"/>

  <circle cx="443" cy="320" r="255" fill="#D6E4EB" fill-opacity="0.65"/>
  <circle cx="300" cy="566" r="255" fill="#A5BBC8" fill-opacity="0.65"/>
  <circle cx="586" cy="566" r="255" fill="#7794A4" fill-opacity="0.65"/>

  <g font-style="italic" font-weight="500" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.015em" fill="#061D2B">

    <g font-size="26" font-weight="700">
      <text x="443" y="200">The Long Tide</text>
      <text x="443" y="230">som universelt felt</text>
    </g>

    <g font-size="26" font-weight="700">
      <text x="200" y="624">Det relationelle</text>
      <text x="200" y="654">felt</text>
      <text x="200" y="684">integreret</text>
    </g>

    <g font-size="26" font-weight="700">
      <text x="686" y="624">Porten til</text>
      <text x="686" y="654">Dynamisk</text>
      <text x="686" y="684">Stilhed</text>
    </g>

    <g font-size="22">
      <text x="305" y="395">fælles</text>
      <text x="305" y="421">synkronisering</text>
    </g>

    <g font-size="22">
      <text x="581" y="395">rytme fra</text>
      <text x="581" y="421">stilhed</text>
    </g>

    <g font-size="22">
      <text x="443" y="640">transmutationens</text>
      <text x="443" y="666">åbning</text>
    </g>

    <g font-size="28">
      <text x="443" y="500" font-weight="700">Rum D</text>
      <text x="443" y="530">ét universelt</text>
      <text x="443" y="560">felt</text>
    </g>
  </g>
</svg>
